# Policy of this KB, whoever serves it (settings.yaml). It is read from the KB
# repository on every mount, so a setting here wins over the same one in a
# server's kbs[] entry. Machine-bound keys (author_*) stay in the server
# config, and every secret is a file of the server's credentials_dir, never of
# the KB. Change it through git review.

# --- available settings: uncomment a key to set it ---

# Days a skill or agent may go unused by every client before kb_status.usage
# counts it as stale. A value under 7 is raised to 7 with a warning; there is
# no value that turns the signal off.
# Values: 7 or more
# usage_stale_days: 42

# Branch Cartographer commits and pushes to, in place of the remote's default
# one; the first push creates it. Empty or absent: the remote's default
# branch. Only the settings.yaml committed on the remote's default branch
# counts: a change made on any other branch has no effect until it reaches the
# default one.
# branch: ""
